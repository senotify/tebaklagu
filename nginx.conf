# Autocomplete is the hot path and every player's request reaches Deezer from
# this one server IP, against a 50-requests-per-5-seconds limit. Caching search
# results keeps repeated queries off that budget.
proxy_cache_path /var/cache/nginx/deezer levels=1:2 keys_zone=deezer_search:10m
                 max_size=100m inactive=60m use_temp_path=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Search results are stable enough to cache and are requested repeatedly.
    location /api/deezer/search {
        proxy_pass https://api.deezer.com/search;
        proxy_ssl_server_name on;
        proxy_set_header Host api.deezer.com;

        proxy_cache deezer_search;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Never cache: /track responses carry a preview URL signed with a token that
    # expires ~15 minutes out, so a cached copy hands players a dead audio link.
    location /api/deezer/ {
        proxy_pass https://api.deezer.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.deezer.com;
        proxy_cache off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
